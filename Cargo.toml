[package]
  name = "brainfoamkit"
  version = "1.1.1-next.12"
  edition = "2024"
  readme = "README.md"
  description = "An interpreter for the brainf*** language"
  rust-version = "1.85.0"
  repository = "https://github.com/AliSajid/brainfoamkit"
  license = "MIT OR Apache-2.0"

[lib]
  name = "brainfoamkit_lib"
  path = "src/brainfoamkit_lib/lib.rs"
  crate-type = ["lib"]

[[bin]]
  name = "bfkview"
  path = "src/brainfoamkit_visualizer/main.rs"

[[bin]]
  name = "bfkrun"
  path = "src/brainfoamkit_interpreter/main.rs"

[dependencies]
  anyhow = { version = "1.0.79", features = ["backtrace"] }
  crossterm = "0.29.0"
  prettytable-rs = "0.10.0"
  ratatui = { version = "0.29.0", features = [
    "macros",
    "serde",
    "document-features",
  ] }

[profile.dev]
  opt-level = 1
  debug = true

[profile.release]
  opt-level = 3
  strip = true
  lto = true
  codegen-units = 1

[dev-dependencies]
  tempfile = "=3.23.0"
  tracing = "0.1.44"
  tracing-subscriber = "0.3.22"

[lints.clippy]
  pedantic = { level = "warn", priority = -1 }
  nursery = { level = "warn", priority = -1 }
  cargo = { level = "warn", priority = -1 }
  unwrap_used = "warn"
  expect_used = "warn"
  redundant_feature_names = "warn"
  cargo_common_metadata = "warn"
  todo = "warn"
  unimplemented = "warn"
  cast-lossless = "warn"
  cast-possible-truncation = "warn"
  cast-possible-wrap = "warn"
  wildcard_dependencies = "warn"
  dbg_macro = "warn"
  exhaustive_enums = "warn"
  pub_with_shorthand = "deny"
