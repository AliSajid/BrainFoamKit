---
name: OCI Container Build, Mirror, Sign
on:
    workflow_dispatch:
    workflow_call:
env:
    # ---- registries ----
    CANONICAL_REGISTRY: ghcr.io
    # ---- versions ----
    COSIGN_RELEASE_VERSION: v3.0.4
    SYFT_VERSION: v1.40.0
jobs:
    build:
        runs-on: ubuntu-24.04
        permissions:
            packages: write
            id-token: write
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                egress-policy: audit
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
            - name: Set build environment
              id: env
              run: |
                echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
            - name: Install tooling
              run: |
                sudo apt-get update
                sudo apt-get install -y jq qemu-user-static
                dpkg -l | grep qemu-user-static
            - name: Enable multi-arch emulation
              run: |
                docker run --privileged --rm tonistiigi/binfmt --install arm64
            # ---------- metadata ----------
            - name: Generate metadata (GHCR canonical)
              id: meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
              with:
                images: |
                    ${{ env.CANONICAL_REGISTRY }}/${{ github.repository }}
                tags: |
                    type=ref,event=branch
                    type=ref,event=tag
                    type=semver,pattern={{version}}
                    type=semver,pattern={{major}}.{{minor}}
                    type=semver,pattern={{major}}
                    type=sha,format=short
                labels: |
                    org.opencontainers.image.source=${{ github.repository }}
                    org.opencontainers.image.description=Brainfuck interpreter and TUI visualizer with custom byte-level type system
                    org.opencontainers.image.licenses=MIT AND Apache-2.0
            # ---------- auth ----------
            - name: Login to GitHub Container Registry
              uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Login to Docker Hub
              uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}
            - name: Login to Quay.io
              uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
              with:
                registry: quay.io
                username: ${{ vars.QUAY_USERNAME }}
                password: ${{ secrets.QUAY_TOKEN }}
            # ---------- build ----------
            - name: Build and push image to GHCR
              id: build
              env:
                SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
              uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056
              with:
                image: ${{ github.event.repository.name }}
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                platforms: linux/amd64,linux/arm64
                containerfiles: |
                    ./Dockerfile
            - name: Push image to GHCR
              id: push-ghcr
              uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c
              with:
                image: ${{ steps.build.outputs.image }}
                tags: ${{ steps.build.outputs.tags }}
                registry: ${{ env.CANONICAL_REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Push image to Docker Hub
              if: github.event_name != 'pull_request'
              uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c
              with:
                image: ${{ steps.build.outputs.image }}
                tags: ${{ steps.meta.outputs.version }} ${{ steps.meta.outputs.tag-names }}
                registry: docker.io/${{ vars.DOCKER_ORG }}
            - name: Push image to Quay.io
              if: github.event_name != 'pull_request'
              uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c
              with:
                image: ${{ steps.build.outputs.image }}
                tags: ${{ steps.meta.outputs.version }} ${{ steps.meta.outputs.tag-names }}
                registry: quay.io/${{ vars.QUAY_ORG }}
            # ---------- SBOM ----------
            - name: Extract first image tag for SBOM
              if: github.event_name != 'pull_request'
              id: sbom-image
              run: |
                set -euo pipefail
                FIRST_TAG=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1 | tr -d '\r')
                if [ -z "$FIRST_TAG" ]; then
                  echo "No tag found for SBOM generation" >&2
                  exit 1
                fi
                printf 'image=%s\n' "$FIRST_TAG" >> "$GITHUB_OUTPUT"
            - name: Generate SBOM for container image
              if: github.event_name != 'pull_request'
              uses: anchore/sbom-action@0b82b0b1a22399a1c542d4d656f70cd903571b5c # v0.21.1
              with:
                image: ${{ steps.sbom-image.outputs.image }}
                syft-version: ${{ env.SYFT_VERSION }}
                output-file: sbom.json
                format: spdx-json
                upload-artifact: true
                upload-release-assets: true
            # ---------- signing ----------
            - name: Install Cosign
              uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
              with:
                cosign-release: ${{ env.COSIGN_RELEASE_VERSION }}
            - name: Sign and attest image
              if: github.event_name != 'pull_request'
              env:
                TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                set -euo pipefail

                      # Get the first tag (main image reference) and its digest
                      FIRST_TAG=$(echo "${TAGS}" | head -n1)
                      IMAGE_DIGEST=$(podman manifest inspect "${FIRST_TAG}" --raw | sha256sum | cut -d' ' -f1)
                      IMAGE_REF="${FIRST_TAG%:*}@sha256:${IMAGE_DIGEST}"

                echo "Signing image: ${IMAGE_REF}"
                cosign sign -y \
                  --recursive \
                  --record-creation-timestamp \
                  "${IMAGE_REF}"

                echo "Creating SBOM attestation: ${IMAGE_REF}"
                cosign attest -y \
                  --type spdxjson \
                  --predicate sbom.json \
                  --record-creation-timestamp \
                  "${IMAGE_REF}"
            # ---------- verification ----------
            - name: Verify signatures and attestations
              if: github.event_name != 'pull_request'
              env:
                TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                set -euo pipefail

                      # Get the first tag (main image reference) and its digest
                      FIRST_TAG=$(echo "${TAGS}" | head -n1)
                      IMAGE_DIGEST=$(podman manifest inspect "${FIRST_TAG}" --raw | sha256sum | cut -d' ' -f1)
                      IMAGE_REF="${FIRST_TAG%:*}@sha256:${IMAGE_DIGEST}"

                echo "Verifying image signature: ${IMAGE_REF}"
                cosign verify "${IMAGE_REF}" \
                  --recursive \
                  --certificate-identity-regexp "${{ vars.COSIGN_CERTIFICATE_IDENTITY }}" \
                  --certificate-oidc-issuer-regexp "${{ vars.COSIGN_CERTIFICATE_OIDC_ISSUER }}" \
                  --output json | jq .

                echo "Verifying SBOM attestation: ${IMAGE_REF}"
                cosign verify-attestation "${IMAGE_REF}" \
                  --type spdxjson \
                  --certificate-identity-regexp "${{ vars.COSIGN_CERTIFICATE_IDENTITY }}" \
                  --certificate-oidc-issuer-regexp "${{ vars.COSIGN_CERTIFICATE_OIDC_ISSUER }}" \
                  --output json | jq .
