---
name: OCI Container Build, Mirror, Sign
on:
    workflow_dispatch:
    workflow_call:
env:
    # ---- registries ----
    CANONICAL_REGISTRY: ghcr.io
    # ---- versions ----
    COSIGN_RELEASE_VERSION: v2.2.4
    SYFT_VERSION: v1.7.0
jobs:
    build:
        runs-on: ubuntu-22.04
        permissions:
            contents: read
            packages: write
            id-token: write
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@v2
              with:
                egress-policy: audit
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set build environment
              id: env
              run: |
                echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
            - name: Install tooling
              run: |
                sudo apt-get update
                sudo apt-get install -y jq qemu-user-static
                qemu-user-static --version
            - name: Enable multi-arch emulation
              run: |
                sudo update-binfmts --enable
                docker run --privileged --rm tonistiigi/binfmt --install arm64
            # ---------- metadata ----------
            - name: Generate metadata (GHCR canonical)
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: |
                    ${{ env.CANONICAL_REGISTRY }}/${{ github.repository }}
                tags: |
                    type=ref,event=branch
                    type=ref,event=tag
                    type=semver,pattern={{version}}
                    type=semver,pattern={{major}}.{{minor}}
                    type=semver,pattern={{major}}
                    type=sha,format=short
                labels: |
                    org.opencontainers.image.source=${{ github.repository }}
                    org.opencontainers.image.licenses=MIT AND Apache-2.0
            # ---------- auth ----------
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}
            - name: Login to Quay.io
              uses: docker/login-action@v3
              with:
                registry: quay.io
                username: ${{ vars.QUAY_USERNAME }}
                password: ${{ secrets.QUAY_TOKEN }}
            # ---------- build ----------
            - name: Build and push image to GHCR
              id: build
              env:
                SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
              uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056
              with:
                image: ${{ github.event.repository.name }}
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                platforms: linux/amd64,linux/arm64
                containerfiles: |
                    ./Containerfile
                build-args: |
                    SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            - name: Push image to GHCR
              id: push-ghcr
              uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c
              with:
                image: ${{ steps.build.outputs.image }}
                tags: ${{ steps.build.outputs.tags }}
                registry: ${{ env.CANONICAL_REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Push image to Docker Hub
              if: github.event_name != 'pull_request'
              uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c
              with:
                image: ${{ steps.build.outputs.image }}
                tags: ${{ steps.build.outputs.tags }}
                registry: docker.io/${{ vars.DOCKER_ORG }}
            - name: Push image to Quay.io
              if: github.event_name != 'pull_request'
              uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c
              with:
                image: ${{ steps.build.outputs.image }}
                tags: ${{ steps.build.outputs.tags }}
                registry: quay.io/${{ vars.QUAY_ORG }}
            # ---------- SBOM ----------
            - name: Install Syft
              uses: anchore/sbom-action/download-syft@v0.20.11
              with:
                syft-version: ${{ env.SYFT_VERSION }}
            - name: Generate SBOM
              if: github.event_name != 'pull_request'
              run: |
                syft \
                  "${{ env.CANONICAL_REGISTRY }}/${{ github.repository }}:${{ steps.meta.outputs.version }}" \
                  -o spdx-json=sbom.json
            # ---------- signing ----------
            - name: Install Cosign
              uses: sigstore/cosign-installer@v3
              with:
                cosign-release: ${{ env.COSIGN_RELEASE_VERSION }}
            - name: Sign and attest image
              if: github.event_name != 'pull_request'
              env:
                TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                set -euo pipefail

                IFS=$'\n' read -ra TAG_ARRAY <<< "${TAGS}"

                for tag in "${TAG_ARRAY[@]}"; do
                  cosign sign --yes "${tag}"
                  cosign attest --yes \
                    --type spdxjson \
                    --predicate sbom.json \
                    "${tag}"
                done
            # ---------- verification ----------
            - name: Verify signatures and attestations
              if: github.event_name != 'pull_request'
              env:
                TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                set -euo pipefail

                IFS=$'\n' read -ra TAG_ARRAY <<< "${TAGS}"

                for tag in "${TAG_ARRAY[@]}"; do
                  cosign verify "${tag}" \
                    --certificate-identity-regexp "${{ vars.COSIGN_CERTIFICATE_IDENTITY }}" \
                    --certificate-oidc-issuer-regexp "${{ vars.COSIGN_CERTIFICATE_OIDC_ISSUER }}"

                  cosign verify-attestation "${tag}" \
                    --type spdxjson \
                    --certificate-identity-regexp "${{ vars.COSIGN_CERTIFICATE_IDENTITY }}" \
                    --certificate-oidc-issuer-regexp "${{ vars.COSIGN_CERTIFICATE_OIDC_ISSUER }}"
                done
