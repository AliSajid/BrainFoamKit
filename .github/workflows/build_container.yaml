---
name: OCI Container Build, Mirror, Sign
on:
    workflow_dispatch:
    workflow_call:
env:
    # ---- registries ----
    CANONICAL_REGISTRY: ghcr.io
    # ---- versions ----
    COSIGN_RELEASE_VERSION: v3.0.4
    SYFT_VERSION: v1.40.0
jobs:
    build:
        runs-on: ubuntu-24.04
        permissions:
            packages: write
            id-token: write
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
              with:
                egress-policy: audit
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
            - name: Set build environment
              id: env
              run: |
                LAST_COMMIT_EPOCH=$(git log -1 --pretty=%ct)
                LAST_COMMIT_TIMESTAMP=$(date -u --date=@$LAST_COMMIT_EPOCH '+%Y-%m-%dT%H:%M:%SZ')
                echo "SOURCE_DATE_EPOCH=${LAST_COMMIT_EPOCH}" >> "$GITHUB_ENV"
                echo "SOURCE_DATE_TIMESTAMP=${LAST_COMMIT_TIMESTAMP}" >> "$GITHUB_ENV"
            - name: Install tooling
              run: |
                sudo apt-get update
                sudo apt-get install -y jq qemu-user-static skopeo podman
                podman --version
                skopeo --version
            - name: Convert repository name to lowercase
              run: |
                REPO_FULL="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
                REPO_NAME="$(echo '${{ github.repository }}' | awk -F/ '{print $2}' | tr '[:upper:]' '[:lower:]')"

                echo "REPOSITORY_FULL=${REPO_FULL}" >> "$GITHUB_ENV"
                echo "IMAGE_NAME=${REPO_NAME}" >> "$GITHUB_ENV"
            # ---------- metadata ----------
            - name: Generate metadata (GHCR canonical)
              id: meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
              with:
                images: |
                    ${{ env.CANONICAL_REGISTRY }}/${{ env.REPOSITORY_FULL }}
                tags: |
                    type=ref,event=branch
                    type=ref,event=tag
                    type=semver,pattern={{version}}
                    type=semver,pattern={{major}}.{{minor}}
                    type=semver,pattern={{major}}
                    type=sha,format=short
                labels: |
                    org.opencontainers.image.source=${{ env.REPOSITORY_FULL }}
                    org.opencontainers.image.description=Brainfuck interpreter and TUI visualizer with custom byte-level type system
                    org.opencontainers.image.licenses=MIT AND Apache-2.0
                    org.opencontainers.image.created=${{ env.SOURCE_DATE_TIMESTAMP }}
                annotations: |
                    org.opencontainers.image.description=Brainfuck interpreter and TUI visualizer with custom byte-level type system
                    org.opencontainers.image.created=${{ env.SOURCE_DATE_TIMESTAMP }}
            # ---------- auth ----------
            - name: Login to GitHub Container Registry
              uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Login to Docker Hub
              uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}
            - name: Login to Quay.io
              uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
              with:
                registry: quay.io
                username: ${{ vars.QUAY_USERNAME }}
                password: ${{ secrets.QUAY_TOKEN }}
            # ---------- build ----------
            - name: Build and push image to GHCR
              id: build
              env:
                SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
              uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056
              with:
                image: ${{ env.REPOSITORY_FULL }}
                tags: ${{ steps.meta.outputs.tags }}
                layers: true
                labels: ${{ steps.meta.outputs.labels }}
                platforms: linux/amd64,linux/arm64
                build-args: |
                    SOURCE_DATE_EPOCH=${{env.SOURCE_DATE_EPOCH}}
                containerfiles: |
                    ./Dockerfile
            - name: Push image to GHCR
              id: push-ghcr
              uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c
              with:
                tags: ${{ steps.build.outputs.tags }}
            - name: Resolve canonical image digest from GHCR
              id: resolve-digest
              if: github.event_name != 'pull_request'
              env:
                TAGS: ${{ steps.meta.outputs.tags }}
                REGISTRY: ${{ env.CANONICAL_REGISTRY }}
                IMAGE: ${{ env.REPOSITORY_FULL }}
              run: |
                set -euo pipefail

                PRIMARY_TAG=$(printf '%s\n' "${TAGS}" | head -n1)
                FULL_REF="${REGISTRY}/${IMAGE}:${PRIMARY_TAG##*:}"

                DIGEST=$(skopeo inspect "docker://${FULL_REF}" --format '{{.Digest}}')

                if [ -z "${DIGEST}" ]; then
                  echo "Failed to resolve image digest" >&2
                  exit 1
                fi

                echo "image_ref=${REGISTRY}/${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
            # ---------- SBOM ----------
            - name: Generate SBOM for container image
              if: github.event_name != 'pull_request'
              uses: anchore/sbom-action@0b82b0b1a22399a1c542d4d656f70cd903571b5c
              with:
                image: ${{ steps.resolve-digest.outputs.image_ref }}
                syft-version: ${{ env.SYFT_VERSION }}
                output-file: sbom.json
                format: spdx-json
                upload-artifact: true
                upload-release-assets: true
            # ---------- signing ----------
            - name: Install Cosign
              uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
              with:
                cosign-release: ${{ env.COSIGN_RELEASE_VERSION }}
            - name: Sign and attest image
              if: github.event_name != 'pull_request'
              env:
                IMAGE_REF: ${{ steps.resolve-digest.outputs.image_ref }}
              run: |
                set -euo pipefail

                echo "Signing image: ${IMAGE_REF}"
                cosign sign -y \
                  --recursive \
                  --record-creation-timestamp \
                  "${IMAGE_REF}"

                echo "Creating SBOM attestation: ${IMAGE_REF}"
                cosign attest -y \
                  --type spdxjson \
                  --predicate sbom.json \
                  --record-creation-timestamp \
                  "${IMAGE_REF}"
            # ---------- verification ----------
            - name: Verify signatures and attestations
              if: github.event_name != 'pull_request'
              env:
                IMAGE_REF: ${{ steps.resolve-digest.outputs.image_ref }}
              run: |
                set -euo pipefail

                echo "Verifying image signature: ${IMAGE_REF}"
                cosign verify "${IMAGE_REF}" \
                  --certificate-identity-regexp "${{ vars.COSIGN_CERTIFICATE_IDENTITY }}" \
                  --certificate-oidc-issuer-regexp "${{ vars.COSIGN_CERTIFICATE_OIDC_ISSUER }}" \
                  --output json | jq .

                echo "Verifying SBOM attestation: ${IMAGE_REF}"
                cosign verify-attestation "${IMAGE_REF}" \
                  --type spdxjson \
                  --certificate-identity-regexp "${{ vars.COSIGN_CERTIFICATE_IDENTITY }}" \
                  --certificate-oidc-issuer-regexp "${{ vars.COSIGN_CERTIFICATE_OIDC_ISSUER }}" \
                  --output json | jq .
            # ---------- mirroring ----------
            - name: Mirror image by digest to Docker Hub and Quay
              if: github.event_name != 'pull_request'
              env:
                IMAGE_REF: ${{ steps.resolve-digest.outputs.image_ref }}
                DOCKER_ORG: ${{ vars.DOCKER_ORG }}
                QUAY_ORG: ${{ vars.QUAY_ORG }}
                IMAGE_NAME: ${{ env.IMAGE_NAME }}
                TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                set -euo pipefail

                for TARGET in docker.io/${DOCKER_ORG} quay.io/${QUAY_ORG}; do
                  echo "Mirroring ${IMAGE_REF} to ${TARGET}/${IMAGE_NAME}"

                  skopeo copy \
                    --all \
                    docker://${IMAGE_REF} \
                    docker://${TARGET}/${IMAGE_NAME}
                done
            - name: Apply tags to mirrored images
              if: github.event_name != 'pull_request'
              env:
                TAGS: ${{ steps.meta.outputs.tags }}
                IMAGE_NAME: ${{ env.IMAGE_NAME }}
                DOCKER_ORG: ${{ vars.DOCKER_ORG }}
                QUAY_ORG: ${{ vars.QUAY_ORG }}
              run: |
                set -euo pipefail

                for TAG in ${TAGS}; do
                  for TARGET in docker.io/${DOCKER_ORG} quay.io/${QUAY_ORG}; do
                    skopeo copy \
                      docker://${{ env.CANONICAL_REGISTRY }}/${{ env.REPOSITORY_FULL }}:${TAG##*:} \
                      docker://${TARGET}/${IMAGE_NAME}:${TAG##*:}
                  done
                done
            - name: Verify digest consistency across registries
              if: github.event_name != 'pull_request'
              env:
                IMAGE_REF: ${{ steps.resolve-digest.outputs.image_ref }}
                IMAGE_NAME: ${{ env.IMAGE_NAME }}
                DOCKER_ORG: ${{ vars.DOCKER_ORG }}
                QUAY_ORG: ${{ vars.QUAY_ORG }}
              run: |
                set -euo pipefail

                CANONICAL_DIGEST="${IMAGE_REF##*@}"

                echo "Canonical digest: ${CANONICAL_DIGEST}"

                for TARGET in \
                  docker.io/${DOCKER_ORG}/${IMAGE_NAME} \
                  quay.io/${QUAY_ORG}/${IMAGE_NAME}; do

                  TARGET_DIGEST=$(skopeo inspect docker://${TARGET} --format '{{.Digest}}')

                  echo "${TARGET} -> ${TARGET_DIGEST}"

                  if [ "${TARGET_DIGEST}" != "${CANONICAL_DIGEST}" ]; then
                    echo "Digest mismatch detected for ${TARGET}" >&2
                    exit 1
                  fi
                done

                echo "All registries match canonical digest"
